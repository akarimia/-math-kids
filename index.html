<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><meta name="theme-color" content="#22b8f0"><meta name="description" content="بازی شاد و فارسی برای تمرین جمع، تفریق و جدول ضرب کودکان"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png" type="image/png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<title>قهرمان ریاضی</title>
<style>
:root{--blue:#19aee8;--navy:#15376b;--green:#20b85a;--yellow:#ffc928;--pink:#ff718b;--purple:#9565e8;--bg:#effaff}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#8de3ff 0,#eefbff 42%,#f9fdff 100%);color:var(--navy);min-height:100vh}button{font-family:inherit;cursor:pointer;border:0} .app{max-width:520px;margin:auto;min-height:100vh;padding:16px 15px 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-weight:900;font-size:23px;color:#fff;text-shadow:0 2px 0 #1485d1,2px 3px 0 #1485d1;line-height:1.5}.pill{background:#fff;border:2px solid #d3f4ff;border-radius:22px;padding:9px 13px;font-weight:bold;box-shadow:0 4px 0 #c5edff;white-space:nowrap}.panel{background:rgba(255,255,255,.94);border:2px solid #d5f3ff;border-radius:26px;padding:19px;box-shadow:0 7px 0 rgba(30,160,220,.12);margin-bottom:16px}.hero{text-align:center;padding:23px 16px 20px}.mascot{font-size:62px;line-height:1.2;margin:5px}.sub{color:#56779b;font-size:14px;line-height:1.9}.mainbtn{display:block;width:100%;padding:15px 18px;border-radius:18px;color:#fff;font-weight:900;font-size:18px;background:linear-gradient(#ffdb45,#ffb900);box-shadow:0 5px 0 #df9200;margin-top:15px}.greenbtn{background:linear-gradient(#31d96d,#16a94e);box-shadow:0 5px 0 #0c8a3b}.bluebtn{background:linear-gradient(#39c8ff,#128ee4);box-shadow:0 5px 0 #0875bd}.title{font-size:21px;font-weight:900;text-align:center;margin:4px 0 16px}.level{display:flex;align-items:center;gap:12px;text-align:right;padding:14px;border-radius:20px;border:2px solid;margin:12px 0;width:100%;background:#fff;color:var(--navy)}.level .num{font-size:25px;font-weight:900;border-radius:50%;width:48px;height:48px;display:grid;place-items:center;color:#fff;flex-shrink:0}.level .info{flex:1}.level strong{font-size:17px}.level small{display:block;color:#55728f;line-height:1.8;margin-top:4px}.level .count{font-size:13px;font-weight:bold;background:#fff;border-radius:20px;padding:4px 8px;display:inline-block;margin-top:5px}.level.locked{opacity:.62;filter:saturate(.6)}.progress{height:13px;border-radius:20px;background:#e3f0f8;overflow:hidden;margin:8px 0 14px}.bar{height:100%;width:0;background:linear-gradient(90deg,#29d96c,#a5eb45);border-radius:20px;transition:width .25s}.stats{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:bold}.question{font-size:39px;font-weight:900;text-align:center;background:linear-gradient(#fff,#eaf8ff);border-radius:22px;padding:30px 8px;margin:18px 0;color:#14386c;direction:ltr}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{padding:16px 8px;font-size:25px;font-weight:900;border-radius:18px;background:#e5f4ff;border:2px solid #57baff;color:#15376b;box-shadow:0 3px 0 #b2e2ff}.answer:nth-child(2){background:#ffeaf0;border-color:#ff8aa4;box-shadow:0 3px 0 #ffd1dc}.answer:nth-child(3){background:#fff5ce;border-color:#ffd44d;box-shadow:0 3px 0 #ffe7a0}.answer:nth-child(4){background:#e5ffe9;border-color:#70d987;box-shadow:0 3px 0 #c3f5cc}.answer:disabled{opacity:.8}.feedback{text-align:center;font-weight:900;font-size:18px;line-height:1.9;padding:12px;border-radius:16px;margin:12px 0}.good{background:#e1ffe8;color:#087c37}.bad{background:#fff0ee;color:#b52b3d}.hidden{display:none!important}.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.chip{padding:9px 12px;border-radius:15px;background:#f0f7ff;border:1px solid #cde9ff;font-weight:bold;color:#1d4d80}.chip.active{background:#d8ffdf;border-color:#43cc6b}.bottom{text-align:center;color:#6e8aa5;font-size:12px;margin:18px 0 5px}.trophy{font-size:72px;text-align:center}.bigstars{font-size:30px;color:#f5b900;text-align:center;margin:12px}
.sound-toggle{background:#fff;border:2px solid #d3f4ff;border-radius:18px;padding:8px 10px;font-weight:bold;color:var(--navy)}
#starCelebration{position:fixed;inset:0;display:grid;place-items:center;z-index:99;pointer-events:none;background:rgba(255,255,255,.12)}
#starCelebration.hidden{display:none!important}.star-pop{font-size:clamp(100px,30vw,170px);filter:drop-shadow(0 8px 0 #e3a400);animation:starGather 1.65s cubic-bezier(.18,.75,.3,1) forwards;transform-origin:center}#modeChips{display:none!important}.celebrate-mascot{position:absolute;font-size:clamp(42px,13vw,68px);animation:mascotBounce 1.25s ease-in-out infinite;bottom:18%;left:calc(50% - 30px)}@keyframes mascotBounce{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-18px) rotate(7deg)}}
@keyframes starGather{0%{transform:translate(0,10px) scale(.1) rotate(-35deg);opacity:0}15%{transform:translate(0,0) scale(1.2) rotate(12deg);opacity:1}30%{transform:translate(0,0) scale(1) rotate(0);opacity:1}70%{transform:translate(0,0) scale(1) rotate(0);opacity:1}100%{transform:translate(calc(-42vw + 18px),calc(-43vh + 18px)) scale(.13) rotate(360deg);opacity:0}}
.sparkle{position:absolute;font-size:25px;animation:sparkleOut .8s ease-out forwards}@keyframes sparkleOut{to{transform:translate(var(--dx),var(--dy)) scale(.1) rotate(180deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.star-pop,.sparkle{animation-duration:.01ms!important}}
</style></head><body><main class="app">
<header class="top"><div class="brand">⭐ قهرمان ریاضی</div><div style="display:flex;gap:7px;align-items:center"><button id="soundToggle" class="sound-toggle" onclick="toggleSound()" aria-label="روشن یا خاموش کردن صدا">🔊 صدا</button><div class="pill">⭐ <span id="totalStars">۰</span></div></div></header>
<section id="home" class="panel hero"><div class="mascot">🧒🏻➕</div><h1 class="title">بیا با هم قهرمان ریاضی بشیم!</h1><p class="sub">با حل تمرین‌ها ستاره جمع کن، مهارتت رو بیشتر کن و مرحله‌های تازه رو باز کن.</p><button class="mainbtn" onclick="showLevels()">شروع بازی 🚀</button></section>
<section id="levels" class="panel hidden"><h2 class="title">انتخاب سطح</h2><div id="levelList"></div><button class="mainbtn bluebtn" onclick="showHome()">بازگشت</button></section>
<section id="practice" class="panel hidden"><div class="stats"><span id="levelName">سطح ۱</span><span>⭐ <b id="starsHere">۰</b> ستاره</span></div><div class="progress"><div class="bar" id="progressBar"></div></div><div class="stats"><span id="correctProgress">۰ پاسخ درست تا ستاره بعدی</span><span id="questionCount">تمرین ۱</span></div><div id="modeChips" class="chips" style="margin-top:13px"><button class="chip active" data-mode="all">ترکیبی</button><button class="chip" data-mode="add">جمع</button><button class="chip" data-mode="sub">تفریق</button><button class="chip" data-mode="mul">ضرب</button></div><div id="question" class="question">۷ + ۵ = ؟</div><div id="answers" class="answers"></div><div id="feedback" class="feedback hidden"></div><button id="nextBtn" class="mainbtn greenbtn hidden" onclick="nextQuestion()">سؤال بعدی ←</button><button class="mainbtn bluebtn" onclick="showLevels()" style="margin-top:12px">خروج از تمرین</button></section>
<section id="reward" class="panel hidden"><div class="trophy">🏆</div><h2 class="title">آفرین قهرمان!</h2><p id="rewardText" class="sub" style="text-align:center"></p><button class="mainbtn greenbtn" onclick="continueAfterReward()">ادامه</button></section>
<section id="statsPage" class="panel hidden"><h2 class="title">پیشرفت من</h2><div id="statsContent"></div><button class="mainbtn bluebtn" onclick="showLevels()">بازگشت به سطح‌ها</button></section>
<div class="bottom">تمرین کن، یاد بگیر، بدرخش! ✨</div><div id="starCelebration" class="hidden" aria-live="polite"><div class="star-pop">⭐</div></div>
</main><script>
const fa=n=>String(n).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const LEVELS=[
['شروع جمع','جمع دو عدد یک‌رقمی','add',1],['شروع تفریق','تفریق دو عدد یک‌رقمی؛ جواب منفی ندارد','sub',1],['جمع تا ۱۰','جمع دو عدد یک‌رقمی با جواب تا ۱۰','add',1],['تفریق تا ۱۰','تفریق دو عدد یک‌رقمی با جواب تا ۱۰','sub',1],
['جمع یک‌رقمی و دورقمی','جمع یک عدد یک‌رقمی با یک عدد دورقمی','add',2],['تفریق یک‌رقمی و دورقمی','تفریق یک‌رقمی از دورقمی','sub',2],['جمع دورقمی با انتقال','جمع یک‌رقمی و دورقمی با انتقال','add',2],['تفریق دورقمی با قرض','تفریق یک‌رقمی از دورقمی با قرض گرفتن','sub',2],
['جمع چند عدد','جمع ۲ یا ۳ عدد یک‌رقمی','addMany',3],['تفریق چند عدد','تفریق پیاپی ۲ یا ۳ عدد یک‌رقمی','subMany',3],['جمع زنجیره‌ای','جمع ۳ یا ۴ عدد یک‌رقمی','addMany',4],['چالش چندمرحله‌ای','جمع و تفریق ۴ یا ۵ عدد یک‌رقمی','mixedMany',5],
['جمع دورقمی','جمع دو عدد دورقمی','add',4],['تفریق دورقمی','تفریق دو عدد دورقمی','sub',4],['چالش دورقمی','جمع و تفریق دورقمی ترکیبی','mixed2',5],
['جدول ضرب ۲ تا ۵','تمرین ضرب‌های ۲، ۳، ۴ و ۵','mul',2],['جدول ضرب ۶ تا ۹','تمرین ضرب‌های ۶، ۷، ۸ و ۹','mul',3],['جدول ضرب کامل','تمرین کامل جدول ضرب ۱ تا ۱۰','mul',4],
['عبارت‌های ترکیبی','جمع و ضرب یک‌رقمی؛ رعایت تقدم ضرب','order',5],['قهرمان عملیات','جمع، تفریق و ضرب یک‌رقمی در یک عبارت','order',6]
];
const defaults={stars:Array(20).fill(0),correctRemainder:0,totalCorrect:0,totalQuestions:0,unlocked:2};
let data;try{data=JSON.parse(localStorage.getItem('mathHeroSave')||'null')}catch(e){data=null}if(!data)data={...defaults};data.stars=Array.isArray(data.stars)?Array.from({length:20},(_,i)=>Math.max(0,Number(data.stars[i])||0)):Array(20).fill(0);data.correctRemainder=Number(data.correctRemainder)||0;data.totalCorrect=Number(data.totalCorrect)||0;data.totalQuestions=Number(data.totalQuestions)||0;data.unlocked=Math.max(2,Number(data.unlocked)||0);for(let i=0;i<19;i++){if(data.stars[i]>=10)data.unlocked=Math.max(data.unlocked,Math.min(19,i<3?3:i+1))}data.unlocked=Math.min(19,data.unlocked);
let level=0,mode='all',q=null,answered=false,afterReward='levels',soundOn=true,audioCtx=null;
const $=id=>document.getElementById(id);
function toggleSound(){soundOn=!soundOn;$('soundToggle').textContent=soundOn?'🔊 صدا':'🔇 بی‌صدا';if(soundOn)playSound('correct')}
function tone(freq,start,duration,type='sine',gain=.07,slide=0){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+start;o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+duration);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(gain,t+.018);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.03)}catch(e){}}
function playSound(kind){if(!soundOn)return;if(kind==='correct'){tone(660,0,.16,'triangle',.12,140);tone(880,.09,.2,'sine',.14,180);tone(1175,.2,.24,'sine',.13);tone(1568,.31,.22,'triangle',.11)}else if(kind==='wrong'){tone(330,0,.16,'triangle',.09,-70);tone(260,.1,.2,'sine',.085,-55)}else if(kind==='star'){[784,988,1175,1568,1760].forEach((f,i)=>tone(f,i*.09,.27,'sine',.14,90));tone(523,.04,.42,'triangle',.09,220);tone(1319,.25,.35,'triangle',.12,180)}else if(kind==='level'){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.13,.32,'triangle',.14,100));tone(1568,.68,.55,'sine',.15,160);tone(1967,.9,.45,'triangle',.12,120)}}
function celebrateStar(){const layer=$('starCelebration');layer.classList.remove('hidden');layer.innerHTML='<div class="star-pop">⭐</div><div class="celebrate-mascot">🦊🎉</div><span class="sparkle" style="--dx:-90px;--dy:-100px">✨</span><span class="sparkle" style="--dx:95px;--dy:-85px">🎊</span><span class="sparkle" style="--dx:-100px;--dy:80px">🌟</span><span class="sparkle" style="--dx:85px;--dy:90px">💫</span>';playSound('star');setTimeout(()=>layer.classList.add('hidden'),1750)}
function save(){localStorage.setItem('mathHeroSave',JSON.stringify(data));updateTop()}function updateTop(){$('totalStars').textContent=fa(data.stars.reduce((a,b)=>a+b,0))}function hideAll(){['home','levels','practice','reward','statsPage'].forEach(x=>$(x).classList.add('hidden'))}function showHome(){hideAll();$('home').classList.remove('hidden');updateTop()}function showLevels(){hideAll();$('levels').classList.remove('hidden');renderLevels()}
function renderLevels(){const colors=['#54d477','#54baff','#bd8cff','#ffb65c'];$('levelList').innerHTML=LEVELS.map((it,i)=>{let locked=i>data.unlocked;return `<button class="level ${locked?'locked':''}" style="border-color:${colors[i%4]}" onclick="chooseLevel(${i})"><span class="num" style="background:${colors[i%4]}">${fa(i+1)}</span><span class="info"><strong>مرحله ${fa(i+1)} — ${it[0]}</strong><small>${it[1]}</small><span class="count">⭐ ${fa(data.stars[i])} ⭐</span><span class="progress"><span class="bar" style="display:block;width:${Math.min(100,data.stars[i]/10*100)}%"></span></span></span><span>${locked?'🔒':'➜'}</span></button>`}).join('')+`<button class="chip" style="width:100%;margin-top:8px" onclick="showStats()">📊 مشاهده پیشرفت من</button>`}
function chooseLevel(i){if(i>data.unlocked)return;level=i;mode='all';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode==='all'));hideAll();$('practice').classList.remove('hidden');newQuestion()}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function getOp(){return mode==='all'?LEVELS[level][2]:mode}
function makeQuestion(){
 let kind=getOp(),a,b,ans,op,parts=[];
 if(kind==='add'||kind==='sub'){
   if(level<4){
     a=rand(1,9);b=rand(1,9);
     if(kind==='sub'&&b>a)[a,b]=[b,a];
     if(level===2&&a+b>10)return makeQuestion();
     if(level===3){a=rand(1,10);b=rand(1,a)}
   }else if(level<8){
     if(kind==='add'){a=rand(10,99);b=rand(1,9)}
     else {a=rand(10,99);b=rand(1,9);}
   }else if(level>=12){
     a=rand(10,99);b=rand(10,99);
     if(kind==='sub'&&b>a)[a,b]=[b,a];
   }
   op=kind==='add'?'+':'−';ans=kind==='add'?a+b:a-b;
   return {a,b,op,ans,display:`${fa(a)} ${op} ${fa(b)} = ؟`};
 }
 if(kind==='addMany'||kind==='subMany'||kind==='mixedMany'){
   let n=level===8||level===9?rand(2,3):level===10?rand(3,4):rand(4,5);
   parts=[rand(3,9)];let value=parts[0],display=fa(value);
   for(let i=1;i<n;i++){
     let op=kind==='mixedMany'&&Math.random()<.45&&value>0?'−':kind==='subMany'&&value>0?'−':'+';
     let next=op==='−'?rand(1,Math.min(9,value)):rand(1,9);
     value=op==='−'?value-next:value+next;parts.push(next);display+=` ${op} ${fa(next)}`;
   }
   return {ans:value,display:display+' = ؟'};
 }
 if(kind==='mixed2'){
   a=rand(10,99);b=rand(10,99);let sub=Math.random()<.5;
   if(sub&&b>a)[a,b]=[b,a];
   return {ans:sub?a-b:a+b,display:`${fa(a)} ${sub?'−':'+'} ${fa(b)} = ؟`};
 }
 if(kind==='mul'){
   a=level===15?rand(2,5):level===16?rand(6,9):rand(1,10);b=rand(1,10);
   return {a,b,op:'×',ans:a*b,display:`${fa(a)} × ${fa(b)} = ؟`};
 }
 if(kind==='order'){
   let x=rand(1,9),y=rand(1,9),z=rand(1,9),sub=level===19&&Math.random()<.5;
   if(sub){
     // Ensure x - (y × z) is never negative and all factors remain one digit.
     y=rand(1,3);z=rand(1,Math.min(3,Math.floor(9/y)));let product=y*z;x=rand(product,9);
   }
   let ans=sub?x-y*z:x+y*z;
   return {ans,display:`${fa(x)} ${sub?'−':'+'} ${fa(y)} × ${fa(z)} = ؟`};
 }
 return {a:3,b:4,op:'+',ans:7,display:'۳ + ۴ = ؟'};
}
function fmtQ(x){return x.display||`${fa(x.a)} ${x.op} ${fa(x.b)} = ؟`}
function newQuestion(){$('feedback').className='feedback hidden';$('nextBtn').classList.add('hidden');answered=false;q=makeQuestion();$('question').textContent=fmtQ(q);$('answers').innerHTML='';let opts=new Set([q.ans]);while(opts.size<4){let v=q.ans+rand(-10,10);if(v>=0)opts.add(v)}[...opts].sort(()=>Math.random()-.5).forEach(v=>{let b=document.createElement('button');b.className='answer';b.textContent=fa(v);b.onclick=()=>answer(v,b);$('answers').appendChild(b)});refreshProgress()}
function answer(v,btn){if(answered)return;answered=true;data.totalQuestions++;document.querySelectorAll('.answer').forEach(b=>b.disabled=true);let earnedStar=false,justCompleted=false;if(v===q.ans){data.totalCorrect++;data.correctRemainder++;$('feedback').className='feedback good';$('feedback').innerHTML='آفرین! درست جواب دادی! 🥳';playSound('correct');if(data.correctRemainder>=5){data.correctRemainder-=5;const previousStars=data.stars[level];data.stars[level]++;earnedStar=true;$('feedback').innerHTML+=' ⭐ یک ستاره گرفتی!';if(previousStars<10&&data.stars[level]>=10){justCompleted=true;if(level<19){data.unlocked=Math.max(data.unlocked,Math.min(19,level<3?3:level+1));afterReward='unlocked'}else afterReward='levels'}}btn.style.background='#c9ffd7'}else{$('feedback').className='feedback bad';$('feedback').innerHTML=`نزدیک بود! پاسخ درست <b>${fa(q.ans)}</b> بود. دفعه بعد موفق می‌شی! 💪`;playSound('wrong');btn.style.background='#ffd6d6'}save();refreshProgress();if(earnedStar)celebrateStar();$('nextBtn').classList.remove('hidden');if(justCompleted){$('nextBtn').textContent=level<19?'🎉 جشن پایان مرحله':'🏆 قهرمان ریاضی';$('nextBtn').onclick=showReward}else{$('nextBtn').textContent='سؤال بعدی ←';$('nextBtn').onclick=nextQuestion}}
function refreshProgress(){let it=LEVELS[level];$('levelName').textContent=`مرحله ${fa(level+1)} — ${it[0]}`;$('starsHere').textContent=fa(data.stars[level]);$('progressBar').style.width=(Math.min(100,data.stars[level]/10*100))+'%';$('correctProgress').textContent=fa(5-data.correctRemainder)+' پاسخ درست تا ستاره بعدی';$('questionCount').textContent='مجموع تمرین‌ها: '+fa(data.totalQuestions);updateTop()}
function nextQuestion(){newQuestion()}function showReward(){hideAll();$('reward').classList.remove('hidden');playSound('level');if(afterReward==='unlocked'){$('rewardText').innerHTML=`تبریک! ۱۰ ستاره در مرحله ${fa(level+1)} جمع کردی و <b>مرحله ${fa(level+2)}</b> باز شد! 🌟`}else if(level===19&&data.stars[19]>=10){$('rewardText').textContent='تو قهرمان ریاضی هستی! هر ۲۰ مرحله را کامل کردی! 🏆'}else{$('rewardText').textContent='آفرین! این مرحله را عالی پیش بردی. ادامه بده!'}$('reward').querySelector('button').textContent=afterReward==='unlocked'?'رفتن به مرحله بعدی':'ادامه'}function continueAfterReward(){if(afterReward==='unlocked')level=Math.min(19,Math.max(level+1,data.unlocked));if(level===19&&data.stars[19]>=10)showLevels();else chooseLevel(level)}
function showStats(){hideAll();$('statsPage').classList.remove('hidden');$('statsContent').innerHTML=`<p>⭐ مجموع ستاره‌ها: <b>${fa(data.stars.reduce((a,b)=>a+b,0))}</b></p><p>✅ پاسخ‌های درست: <b>${fa(data.totalCorrect)}</b></p><p>📝 تعداد سؤال‌ها: <b>${fa(data.totalQuestions)}</b></p>`+LEVELS.map((it,i)=>`<p>مرحله ${fa(i+1)} (${it[0]}): ${fa(data.stars[i])} ستاره (۱۰ ستاره برای باز شدن مرحله بعد)</p><div class="progress"><div class="bar" style="width:${Math.min(100,data.stars[i]/10*100)}%"></div></div>`).join('')}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{if(!answered){mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));newQuestion()}}));save();showHome();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script></body></html>
